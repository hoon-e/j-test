<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174d42">
  <meta name="description" content="오사카 난바에서 출발하는 2박 3일 간사이 여행 코스 5개. 코스를 고르면 3일 일정과 들를 곳을 한눈에 볼 수 있습니다.">
  <title>간사이 드라이브 | 난바 출발 2박 3일 코스</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/dm-sans-regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./assets/dm-sans-bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=20261011-b">
  <script type="module" src="./app.mjs?v=20261011-b"></script>
</head>
<body>
  <a class="skip-link" href="#main">코스 고르기로 바로가기</a>
  <header class="site-header wrap">
    <a class="brand" href="./" aria-label="간사이 드라이브 홈">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m26 13-4 11-9 3 4-11z" fill="currentColor"/><circle cx="20" cy="20" r="2" fill="#fbfcf8"/></svg>
      <span>간사이 드라이브</span>
    </a>
    <nav aria-label="주요 메뉴">
      <a href="#routes">코스</a>
      <a href="#plan">3일 일정</a>
      <a href="#places">들를 곳</a>
    </nav>
  </header>

  <main id="main">
    <section class="intro wrap" id="routes" aria-labelledby="intro-title">
      <div class="intro-copy">
        <h1 id="intro-title">난바에서 떠나는 2박 3일,<br><em>어디로 갈까요?</em></h1>
        <p>추천 코스 5개 중 하나를 고르면, 바로 아래에 3일 일정과 들를 곳이 나옵니다.</p>
      </div>
      <div class="route-picker" id="route-options" role="group" aria-label="여행 코스 고르기"></div>
    </section>

    <section class="plan" id="plan" aria-labelledby="plan-title">
      <div class="wrap">
        <div class="plan-head" id="plan-head"></div>
        <ol class="days" id="days" aria-label="3일 일정"></ol>
      </div>
    </section>

    <section class="places wrap" id="places" aria-labelledby="places-title">
      <div class="places-head">
        <div>
          <h2 id="places-title">들를 곳</h2>
          <p id="places-subtitle"></p>
        </div>
        <div class="filter-bar" id="filters" role="group" aria-label="장소 분류"></div>
      </div>
      <div class="place-grid" id="place-list"></div>
      <p class="source-note">장소마다 공식 안내 링크를 달았습니다. 정보 확인일: <span id="checked-date"></span>. 운전 시간은 예상치이며, 영업시간과 요금은 가기 전에 다시 확인하세요.</p>
    </section>
    <noscript><div class="wrap no-script"><p>코스를 보려면 자바스크립트를 켜주세요.</p></div></noscript>
  </main>

  <footer class="wrap site-footer"><a class="brand footer-brand" href="./">간사이 드라이브</a><a href="./credits.html">사진·글꼴 출처 <span aria-hidden="true">↗</span></a></footer>
  <div class="sr-only" id="results-status" aria-live="polite"></div>
</body>
</html>
